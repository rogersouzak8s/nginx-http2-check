name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (warnings and errors)
        run: shellcheck -S warning -x check-nginx-http2.sh test-unit.sh test-integration.sh

  unit:
    strategy:
      fail-fast: false
      matrix:
        bash: ["5.3", "3.2"]   # 3.2 is the bash macOS ships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: unit tests on bash ${{ matrix.bash }}
        run: docker run --rm -v "$PWD:/w:ro" -w /w bash:${{ matrix.bash }} bash -c 'bash --version | head -1 && bash ./test-unit.sh'

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./test-integration.sh
